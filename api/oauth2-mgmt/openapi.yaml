openapi: 3.0.0
info:
  title: IBM Verify Identity Access OIDC Provider Management
  description: |
    Administrative REST API for managing OAuth 2.0 / OIDC clients in IBM Verify Identity Access.
    This spec covers only the management surface (/v1.0/oauth_clients, /v1.0/oauth_providers, /v1.0/rules, /v1.0/keystores and /v1.0/custom_token_types).
    Client payloads accept both shapes: a SaaS client payload (./shared/oauth2-components-openapi.yaml) and an on-prem /register payload (./shared/oauth2-onprem-components-openapi.yaml).
  version: 1.0.0
servers:
  - url: '{baseUrl}'
    variables:
      baseUrl:
        default: https://localhost
        description: Base URL of the on-prem Ristretto instance.
security:
  - BearerAuth: []
tags:
  - name: Authorization Detail Types
    description: |
      CRUD operations for Rich Authorization Requests (RAR) authorization detail types.
  - name: Clients
    description: |
      CRUD operations for OAuth 2.0 / OIDC clients. All endpoints operate on the 'default' definition.
  - name: Keystores
    description: |
      CRUD operations for keystores stored in the database. Keystores are global (not scoped to a realm) and are referenced by name in client and definition configuration using the ks: prefix.
  - name: OAuthProvider
    description: |
      Configuration operations for OAuth 2.0 / OIDC OAuth Provider definitions.
  - name: Rules
    description: |
      CRUD operations for JavaScript rules (access policies and mapping rules).
paths:
  /v1.0/auth_detail_types:
    get:
      summary: List authorization detail types.
      operationId: listAuthDetailTypes
      description: Returns a paginated list of authorization detail types for this tenant.
      tags:
        - Authorization Detail Types
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: List of authorization detail types returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDetailTypeListResponse'
        '400':
          description: Invalid request or pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create an authorization detail type.
      operationId: createAuthDetailType
      description: Creates a new authorization detail type.
      tags:
        - Authorization Detail Types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDetailTypeWriteRequest'
      responses:
        '201':
          description: Authorization detail type created.
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
                example: /v1.0/auth_detail_types/aHR0cHM6Ly93d3cuZXhhbXBsZS5jb20vc3RhbmRhcmQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDetailType'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An authorization detail type with this type already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/auth_detail_types/{id}:
    get:
      summary: Get an authorization detail type.
      operationId: getAuthDetailType
      description: Returns an authorization detail type by its base64url ID or literal type URI.
      tags:
        - Authorization Detail Types
      parameters:
        - $ref: '#/components/parameters/auth_detail_type_id'
      responses:
        '200':
          description: Authorization detail type returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDetailTypeSingleResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Authorization detail type not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Replace an authorization detail type.
      operationId: replaceAuthDetailType
      description: Replaces an existing authorization detail type definition.
      tags:
        - Authorization Detail Types
      parameters:
        - $ref: '#/components/parameters/auth_detail_type_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDetailTypeWriteRequest'
      responses:
        '200':
          description: Authorization detail type replaced.
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Authorization detail type not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an authorization detail type.
      operationId: deleteAuthDetailType
      description: Deletes an authorization detail type by its ID or type URI.
      tags:
        - Authorization Detail Types
      parameters:
        - $ref: '#/components/parameters/auth_detail_type_id'
      responses:
        '204':
          description: Authorization detail type deleted.
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/keystores:
    get:
      summary: List keystores.
      operationId: listKeystores
      description: Returns a paginated list of keystore summaries.
      tags:
        - Keystores
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Keystore list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeystoreListResponse'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a keystore.
      operationId: createKeystore
      description: |
        Creates a new keystore in the database. The keystore_name must be unique.
      tags:
        - Keystores
      requestBody:
        required: true
        description: Keystore definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeystoreWriteRequest'
      responses:
        '201':
          description: Keystore created.
          headers:
            Location:
              description: URI of the newly created keystore.
              schema:
                type: string
                example: /v1.0/keystores/mystore
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A keystore with this keystore_name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/keystores/{name}:
    get:
      summary: Get a keystore.
      operationId: getKeystore
      description: Returns summary metadata for the given keystore. The raw keystore data is not returned.
      tags:
        - Keystores
      parameters:
        - $ref: '#/components/parameters/keystore_name'
      responses:
        '200':
          description: Keystore returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeystoreSingleResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Keystore not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Replace a keystore.
      operationId: replaceKeystore
      description: Fully replaces the keystore content for the given name.
      tags:
        - Keystores
      parameters:
        - $ref: '#/components/parameters/keystore_name'
      requestBody:
        required: true
        description: Replacement keystore definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeystoreWriteRequest'
      responses:
        '200':
          description: Keystore updated.
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Keystore not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a keystore.
      operationId: deleteKeystore
      description: Deletes the keystore. Idempotent — returns 204 even if the keystore does not exist.
      tags:
        - Keystores
      parameters:
        - $ref: '#/components/parameters/keystore_name'
      responses:
        '204':
          description: Keystore deleted (or did not exist).
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/oauth_providers:
    get:
      summary: List OAuth providers.
      operationId: listOAuthProviders
      description: Returns a paginated list of OAuth provider configurations.
      tags:
        - OAuthProvider
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: OAuth provider list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderListResponse'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create an OAuth provider.
      operationId: createOAuthProvider
      description: Creates a new OAuth provider definition.
      tags:
        - OAuthProvider
      requestBody:
        required: true
        description: OAuth provider definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthProviderWriteRequest'
      responses:
        '201':
          description: OAuth provider created.
          headers:
            Location:
              description: URI of the newly created OAuth provider.
              schema:
                type: string
                example: /v1.0/oauth_providers/default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderResponse'
        '400':
          description: Invalid request payload or validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Provider with this definition name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/oauth_providers/{name}:
    get:
      summary: Get OAuth provider configuration by name.
      operationId: getOAuthProvider
      description: Returns the OAuth Provider configuration for the specified provider name.
      tags:
        - OAuthProvider
      parameters:
        - name: name
          in: path
          required: true
          description: The provider definition name (e.g. 'default').
          schema:
            type: string
      responses:
        '200':
          description: OAuth Provider configuration returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderResponse'
        '404':
          description: Configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Replace OAuth provider configuration by name.
      operationId: replaceOAuthProvider
      description: Replaces the OAuth Provider configuration for the specified provider name.
      tags:
        - OAuthProvider
      parameters:
        - name: name
          in: path
          required: true
          description: The provider definition name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthProviderWriteRequest'
      responses:
        '200':
          description: Configuration replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderResponse'
        '400':
          description: Invalid request payload or validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete OAuth provider configuration by name.
      operationId: deleteOAuthProvider
      description: Deletes the specified OAuth provider configuration.
      tags:
        - OAuthProvider
      parameters:
        - name: name
          in: path
          required: true
          description: The provider definition name.
          schema:
            type: string
      responses:
        '204':
          description: Provider deleted.
        '404':
          description: Configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/oauth_clients:
    get:
      summary: List clients.
      operationId: listClients
      description: Returns a paginated list of client summaries.
      tags:
        - Clients
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Client list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a client.
      operationId: createClient
      description: |
        Creates a new OAuth 2.0 / OIDC client. If client_id is not provided, one is generated automatically.
      tags:
        - Clients
      parameters: null
      requestBody:
        required: true
        description: Client definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientWriteRequest'
      responses:
        '201':
          description: Client created.
          headers:
            Location:
              description: URI of the newly created client.
              schema:
                type: string
                example: /v1.0/oauth_clients/abc123
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A client with this client_id already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/oauth_clients/{id}:
    get:
      summary: Get a client.
      operationId: getClient
      description: Returns the full client definition for the given client ID.
      tags:
        - Clients
      parameters:
        - $ref: '#/components/parameters/client_id'
      responses:
        '200':
          description: Client returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSingleResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Replace a client.
      operationId: replaceClient
      description: Fully replaces the client definition for the given client ID.
      tags:
        - Clients
      parameters:
        - $ref: '#/components/parameters/client_id'
      requestBody:
        required: true
        description: Replacement client definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientWriteRequest'
      responses:
        '200':
          description: Client updated.
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Client not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a client.
      operationId: deleteClient
      description: Deletes the client. Idempotent — returns 204 even if the client does not exist.
      tags:
        - Clients
      parameters:
        - $ref: '#/components/parameters/client_id'
      responses:
        '204':
          description: Client deleted (or did not exist).
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/rules:
    get:
      summary: List rules.
      operationId: listRules
      description: Returns a paginated list of rule summaries (without source).
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Rule list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleListResponse'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a rule.
      operationId: createRule
      description: |
        Creates a new rule from its name, class and source. The rule type, the imported scripts/bindings and the compiled bytecode are derived by the server.
      tags:
        - Rules
      requestBody:
        required: true
        description: Rule definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreateRequest'
      responses:
        '201':
          description: Rule created.
          headers:
            Location:
              description: URI of the newly created rule.
              schema:
                type: string
                example: /v1.0/rules/my_mapping_rule
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A rule with this name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/rules/{name}:
    get:
      summary: Get a rule.
      operationId: getRule
      description: Returns the full rule definition, including its source, for the given rule name.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/rule_name'
      responses:
        '200':
          description: Rule returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSingleResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Replace a rule.
      operationId: replaceRule
      description: |
        Replaces the class and source of the rule with the given name. The previously compiled bytecode is discarded.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/rule_name'
      requestBody:
        required: true
        description: Replacement rule definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleReplaceRequest'
      responses:
        '200':
          description: Rule updated.
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a rule.
      operationId: deleteRule
      description: Deletes the rule. Idempotent — returns 204 even if the rule does not exist.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/rule_name'
      responses:
        '204':
          description: Rule deleted (or did not exist).
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/custom_token_types:
    get:
      summary: List custom token types.
      operationId: listCustomTokenTypes
      description: Returns a paginated list of custom token types, ordered by name.
      tags:
        - Custom Token Types
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: List of custom token types returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenTypeListResponse'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a custom token type.
      operationId: createCustomTokenType
      description: |
        Registers a trusted external token issuer. The id is generated by the server. The name must be unique and must not collide with a built-in token type. SaaS-only fields (description, issue, identityMapping.jitp, identityMapping.realm, identityMapping.attributeMappings) are accepted and silently discarded.
      tags:
        - Custom Token Types
      requestBody:
        required: true
        description: Custom token type definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenTypeWriteRequest'
      responses:
        '201':
          description: Custom token type created.
          headers:
            Location:
              description: URI of the newly created custom token type.
              schema:
                type: string
                example: /v1.0/custom_token_types/dXJuOnRlc3Q6Y29t
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenType'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A custom token type with this name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1.0/custom_token_types/{id}:
    get:
      summary: Get a custom token type.
      operationId: getCustomTokenType
      description: Returns the custom token type with the given id.
      tags:
        - Custom Token Types
      parameters:
        - $ref: '#/components/parameters/custom_token_type_id'
      responses:
        '200':
          description: Custom token type returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenTypeSingleResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Custom token type not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Replace a custom token type.
      operationId: replaceCustomTokenType
      description: |
        Fully replaces the custom token type with the given id. The name and the type are immutable: the request must carry the same values as the stored token type.
      tags:
        - Custom Token Types
      parameters:
        - $ref: '#/components/parameters/custom_token_type_id'
      requestBody:
        required: true
        description: Replacement custom token type definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenTypeWriteRequest'
      responses:
        '200':
          description: Custom token type replaced.
        '400':
          description: Invalid request body, or name/type differ from the stored values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Custom token type not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a custom token type.
      operationId: deleteCustomTokenType
      description: Deletes the custom token type. Idempotent — returns 204 even if it does not exist.
      tags:
        - Custom Token Types
      parameters:
        - $ref: '#/components/parameters/custom_token_type_id'
      responses:
        '204':
          description: Custom token type deleted (or did not exist).
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    rule_name:
      name: name
      in: path
      required: true
      description: The rule name.
      schema:
        type: string
    client_id:
      name: id
      in: path
      required: true
      description: The client identifier.
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      description: Maximum number of clients to return per page. Defaults to 20.
      schema:
        type: integer
        default: 20
        minimum: 1
    page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        default: 1
        minimum: 1
    auth_detail_type_id:
      name: id
      in: path
      required: true
      description: Base64url ID or type URI of the authorization detail type.
      schema:
        type: string
    keystore_name:
      name: name
      in: path
      required: true
      description: The keystore name.
      schema:
        type: string
    custom_token_type_id:
      name: id
      in: path
      required: true
      description: |
        Id of the custom token type: the unpadded base64url encoding (RFC 4648 section 5) of its name. The name is a URN that is not guaranteed to be URL friendly.
      example: dXJuOnRlc3Q6Y29t
      schema:
        type: string
  schemas:
    KeystoreWriteRequest:
      type: object
      description: Request body for POST (create) and PUT (replace) keystore operations.
      required:
        - keystore_name
        - keystore_type
        - keystore_data
      properties:
        keystore_name:
          type: string
          maxLength: 256
          description: Unique name for the keystore. Used as the primary key and in "ks:" references.
        keystore_type:
          type: string
          enum:
            - pem
            - p12
          description: Keystore type.
        keystore_data:
          type: string
          writeOnly: true
          description: |
            Keystore content. For p12 this is the base64-encoded PKCS#12 file. For pem this is a JSON document of the form {"certificates":[{"label":"...","content":"-----BEGIN CERTIFICATE-----..."}], "keys":[{"label":"...","content":"-----BEGIN PRIVATE KEY-----..."}]}. Never returned on read.
        keystore_password:
          type: string
          writeOnly: true
          description: Password / passphrase for p12 keystores. Write-only, never returned.
    KeystoreSummary:
      type: object
      description: Keystore metadata returned on list and get operations. Raw data is never included.
      properties:
        keystore_name:
          type: string
          readOnly: true
          description: Keystore name (primary key).
        keystore_type:
          type: string
          readOnly: true
          description: Keystore type.
        created_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this keystore was created.
        updated_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this keystore was last updated.
    KeystoreListResponse:
      type: object
      properties:
        keystores:
          type: array
          description: List of keystore summaries for the current page.
          items:
            $ref: '#/components/schemas/KeystoreSummary'
        total:
          type: integer
          description: Total number of keystores across all pages.
        count:
          type: integer
          description: Number of keystores returned on this page.
        limit:
          type: integer
          description: Maximum keystores per page that was requested.
        page:
          type: integer
          description: Current page number (1-based).
    KeystoreSingleResponse:
      description: Single keystore returned by a GET-by-name request.
      allOf:
        - $ref: '#/components/schemas/KeystoreSummary'
    ClientListResponse:
      type: object
      properties:
        clients:
          type: array
          description: List of client summaries for the current page.
          items:
            $ref: '#/components/schemas/ClientSummary'
        total:
          type: integer
          description: Total number of clients across all pages.
        count:
          type: integer
          description: Number of clients returned on this page.
        limit:
          type: integer
          description: Maximum clients per page that was requested.
        page:
          type: integer
          description: Current page number (1-based).
    ClientSingleResponse:
      description: Single client returned by a GET-by-id request.
      allOf:
        - $ref: '#/components/schemas/Client'
    ClientSummary:
      description: |
        Management metadata fields. These are on-prem management concerns (identity, lifecycle, tagging) that sit outside the OIDC spec.
      type: object
      properties:
        client_id:
          type: string
          description: Client identifier.
          readOnly: true
        client_id_issued_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) at which the client identifier was assigned.
          readOnly: true
        client_secret_expires_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) at which the client secret expires. 0 means never.
          readOnly: true
        definition_name:
          type: string
          description: Name of the definition (realm) this client belongs to.
          readOnly: true
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (milliseconds) when this client was created.
          readOnly: true
        client_name:
          type: string
          description: Human-readable client name.
        tags:
          type: array
          description: Arbitrary string tags for grouping or filtering.
          items:
            type: string
    Client:
      description: |
        Full client definition as returned by GET /v1.0/oauth_clients/{id}. Same superset as ClientWriteRequest (SaaS client + on-prem client) plus the read-only management metadata.
      allOf:
        - $ref: '#/components/schemas/ClientSummary'
        - $ref: '#/components/schemas/ClientPayload'
    ClientWriteRequest:
      description: |
        Request body for POST (create) and PUT (replace). client_id is optional on create (auto-generated if omitted). client_secret is write-only — accepted here, never returned on read.
      allOf:
        - $ref: '#/components/schemas/ClientPayload'
        - type: object
          properties:
            client_id:
              type: string
              description: Client identifier. Optional on create; auto-generated if not provided.
            client_secret:
              type: string
              description: Client secret. Auto-generated if omitted on create.
              writeOnly: true
            tags:
              type: array
              description: Arbitrary string tags for grouping or filtering.
              items:
                type: string
    ClientPayload:
      description: |
        Client metadata accepted by the management API. A payload is valid if it is a valid SaaS client payload (ClientMetadata, the body of SaaS POST /oauth2/register) and/or a valid on-prem client payload (DynamicClientRequest, the body of on-prem POST /register, plus the on-prem runtime client properties in OnPremClientFields). These are flat objects with no conflicting property names, so either payload, or a mix of both, can be sent as-is. Where SaaS and on-prem define the same property, the on-prem definition is stricter (enums) and wins. `extension` is the shared DynamicClientExtension (same as SaaS).
      allOf:
        - $ref: '#/components/schemas/ClientMetadata'
        - $ref: '#/components/schemas/DynamicClientRequest'
        - $ref: '#/components/schemas/OnPremClientFields'
    OnPremClientFields:
      type: object
      description: |
        On-prem runtime client properties that are neither in the SaaS client nor in the on-prem /register payload. Top-level, matching the on-prem runtime client model. All fields are optional.
      properties:
        enabled:
          type: boolean
          description: Whether the client is enabled.
        audience:
          type: array
          description: Allowed audience values for tokens issued to this client.
          items:
            type: string
        scopes:
          type: array
          description: Allowed scopes as an explicit array (complement to the scope string).
          items:
            type: string
        response_modes:
          type: array
          description: OAuth 2.0 response modes the client may use.
          items:
            type: string
        dpop_bound_access_tokens:
          type: boolean
          description: Whether DPoP-bound access tokens are required.
        dpop_signing_alg:
          type: string
          description: JWS algorithm required for DPoP proof JWTs.
        dpop_single_use_jti:
          type: boolean
          description: Whether the DPoP proof JTI must be single-use.
        enforce_dpop_nonce:
          type: boolean
          description: Whether the server must supply a nonce in DPoP proofs.
        token_exchange_settings:
          $ref: '#/components/schemas/TokenExchangeSettings'
        act_as_credential_issuer:
          type: boolean
          description: Whether this client may act as a verifiable credential issuer.
        generate_verification_uri_qrcode:
          type: boolean
          description: Whether a QR code is generated for the device-flow verification URI.
        single_logout_settings:
          $ref: '#/components/schemas/SingleLogoutSettings'
    TokenExchangeSettings:
      type: object
      description: RFC 8693 token-exchange configuration for this client.
      properties:
        client_groups:
          type: array
          description: Client groups allowed to exchange tokens with this client.
          items:
            type: string
        supported_subject_token_types:
          type: array
          description: Subject token types this client accepts for token exchange.
          items:
            type: string
        supported_actor_token_types:
          type: array
          description: Actor token types this client accepts for token exchange.
          items:
            type: string
        supported_requested_token_types:
          type: array
          description: Token types this client may request via token exchange.
          items:
            type: string
        require_actor_token:
          type: boolean
          description: Whether an actor token is required.
        skip_mayact_validation:
          type: boolean
          description: Whether the default may_act claim validation is skipped.
    SingleLogoutSettings:
      type: object
      description: Single logout (SLO) configuration for this client.
      properties:
        logout_option:
          type: string
          description: 'Logout behaviour. Typical values: ''frontchannel'', ''backchannel''.'
        logout_endpoint:
          type: string
          description: RP endpoint that handles logout notifications.
        require_session_id:
          type: boolean
          description: Whether a session ID must be included in the logout request.
        post_logout_redirect_uris:
          type: array
          description: URLs to redirect to after a logout.
          items:
            type: string
    OAuthProviderTokenSettings:
      type: object
      required:
        - access_token_lifetime_seconds
        - grant_types
        - signing_algorithm
        - signing_key_store
        - signing_key_label
      properties:
        access_token_type:
          type: string
          enum:
            - jwt
          default: jwt
        access_token_lifetime_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        refresh_token_lifetime_seconds:
          type: integer
          minimum: 1
        grant_types:
          type: array
          items:
            type: string
        signing_algorithm:
          type: string
          enum:
            - RS256
            - ES256
            - ES384
            - PS256
        signing_key_store:
          type: string
          description: Keystore identifier holding the signing key.
        signing_key_label:
          type: string
          description: Key alias / label within the designated keystore.
        access_policy_id:
          type: string
          maxLength: 256
          description: Access policy evaluated during authorization. Maps to Definition.AccessPolicyID.
        preauth_access_policy_id:
          type: string
          maxLength: 256
          description: Access policy evaluated for the pre-authorized flow. Maps to Definition.PreAuthAccessPolicyID.
        pre_mapping_rule_id:
          type: string
          maxLength: 256
          description: Mapping rule run before the token is built. Maps to Definition.PreMappingRuleID.
        post_mapping_rule_id:
          type: string
          maxLength: 256
          description: Mapping rule run after the token is built. Maps to Definition.PostMappingRuleID.
        user_registry_connection:
          type: string
          description: Server connection to validate user.
    OAuthProviderDCRSoftwareStatementValidation:
      type: object
      properties:
        jwks_uri:
          type: string
        signing_algs:
          type: array
          items:
            type: string
    OAuthProviderDCREndpointAuthentication:
      type: object
      properties:
        require_mtls:
          type: boolean
        require_bearer_token:
          type: boolean
        require_software_statement:
          type: boolean
        allow_custom_client_creds:
          type: boolean
        allow_client_secret_update:
          type: boolean
    OAuthProviderDCRRegistrationAccessToken:
      type: object
      properties:
        generate:
          type: boolean
        lifetime:
          type: integer
          minimum: 1
        scopes:
          type: array
          items:
            type: string
    OAuthProviderDCRSettings:
      type: object
      properties:
        recipe:
          type: string
          enum:
            - FAPI_DEFAULT
            - UK-OB
            - FAPI_UK-OB
            - AU-CDR
            - FAPI_AU-CDR
            - BR-OB
            - FAPI_BR-OB
          description: DCR profile / recipe strategy.
        mapping_rule_id:
          type: string
          maxLength: 256
          description: Mapping rule run during dynamic client registration.
        software_statement_validation:
          $ref: '#/components/schemas/OAuthProviderDCRSoftwareStatementValidation'
        registration_endpoint_authentication:
          $ref: '#/components/schemas/OAuthProviderDCREndpointAuthentication'
        management_endpoint_authentication:
          $ref: '#/components/schemas/OAuthProviderDCREndpointAuthentication'
        registration_access_token:
          $ref: '#/components/schemas/OAuthProviderDCRRegistrationAccessToken'
    OAuthProviderResponse:
      type: object
      required:
        - definition_name
        - issuer
        - version
        - created_at
        - updated_at
      properties:
        definition_name:
          type: string
        issuer:
          type: string
        jwks_sig_keystore:
          type: string
          description: Keystore identifier holding the JWKS signing keys/certificates.
        jwks_enc_keystore:
          type: string
          description: Keystore identifier holding the JWKS encryption keys/certificates.
        token_settings:
          $ref: '#/components/schemas/OAuthProviderTokenSettings'
        dcr_settings:
          $ref: '#/components/schemas/OAuthProviderDCRSettings'
        version:
          type: integer
          readOnly: true
        created_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this OAuth provider was created.
        updated_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this OAuth provider was last updated.
    OAuthProviderListResponse:
      type: object
      properties:
        oauth_providers:
          type: array
          description: List of OAuth provider configurations for the current page.
          items:
            $ref: '#/components/schemas/OAuthProviderResponse'
        total:
          type: integer
          description: Total number of OAuth providers across all pages.
        count:
          type: integer
          description: Number of OAuth providers returned on this page.
        limit:
          type: integer
          description: Maximum OAuth providers per page that was requested.
        page:
          type: integer
          description: 1-based page number that was requested.
    OAuthProviderWriteRequest:
      type: object
      required:
        - issuer
      properties:
        definition_name:
          type: string
          description: Provider definition name. Defaults to 'default' if omitted.
          default: default
        issuer:
          type: string
        jwks_sig_keystore:
          type: string
          description: Keystore identifier holding the JWKS signing keys/certificates.
        jwks_enc_keystore:
          type: string
          description: Keystore identifier holding the JWKS encryption keys/certificates.
        token_settings:
          $ref: '#/components/schemas/OAuthProviderTokenSettings'
        dcr_settings:
          $ref: '#/components/schemas/OAuthProviderDCRSettings'
    RuleClass:
      type: string
      description: Class of the rule.
      enum:
        - accesspolicy
        - mappingrule
      x-enum-varnames:
        - RuleClassAccessPolicy
        - RuleClassMappingRule
    RuleType:
      type: string
      description: Rule language. Always 'javascript'. Set by the server.
      enum:
        - javascript
      x-enum-varnames:
        - RuleTypeJavaScript
    RuleCreateRequest:
      type: object
      required:
        - name
        - class
        - source
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Unique rule name.
        class:
          $ref: '#/components/schemas/RuleClass'
        source:
          type: string
          minLength: 1
          description: JavaScript source of the rule.
    RuleReplaceRequest:
      type: object
      required:
        - class
        - source
      properties:
        class:
          $ref: '#/components/schemas/RuleClass'
        source:
          type: string
          minLength: 1
          description: JavaScript source of the rule.
    RuleSummary:
      type: object
      required:
        - name
        - class
        - type
        - import_script_names
        - import_binding_names
        - created_at
        - updated_at
      properties:
        name:
          type: string
          description: Unique rule name.
        class:
          $ref: '#/components/schemas/RuleClass'
        type:
          $ref: '#/components/schemas/RuleType'
        import_script_names:
          type: array
          description: Rules imported directly via importMappingRule(). Derived by the server.
          items:
            type: string
        import_binding_names:
          type: array
          description: Classes/packages imported directly via importClass/importPackage. Derived by the server.
          items:
            type: string
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (milliseconds) when this rule was created.
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp (milliseconds) when this rule was last updated.
    Rule:
      description: Full rule definition as returned by GET /v1.0/rules/{name}.
      allOf:
        - $ref: '#/components/schemas/RuleSummary'
        - type: object
          required:
            - source
          properties:
            source:
              type: string
              description: JavaScript source of the rule.
    RuleListResponse:
      type: object
      properties:
        rules:
          type: array
          description: List of rule summaries for the current page.
          items:
            $ref: '#/components/schemas/RuleSummary'
        total:
          type: integer
          description: Total number of rules across all pages.
        count:
          type: integer
          description: Number of rules returned on this page.
        limit:
          type: integer
          description: Maximum rules per page that was requested.
        page:
          type: integer
          description: Current page number (1-based).
    RuleSingleResponse:
      description: Single rule returned by a GET-by-name request.
      allOf:
        - $ref: '#/components/schemas/Rule'
    AuthDetailTypeSignatureStrategy:
      type: string
      description: Strategy to calculate the authorization detail signature. Default is full_hash.
      enum:
        - full_hash
        - partial_hash
        - custom
      default: full_hash
    AuthDetailType:
      type: object
      required:
        - type
      properties:
        id:
          type: string
          description: Generated authorization detail type ID (URL-safe base64 of type without padding).
          readOnly: true
        type:
          type: string
          description: The authorization detail type URI. Unique and immutable after creation.
        description:
          type: string
          description: The authorization detail type short description.
        schema:
          type: string
          description: Serialized JSON schema describing the payload structure.
        useCustomMapping:
          type: boolean
          description: Indicates whether custom privacy model is used.
        signatureStrategy:
          $ref: '#/components/schemas/AuthDetailTypeSignatureStrategy'
        signatureRule:
          type: string
          description: Rule used to calculate signature when signatureStrategy is 'custom'.
        inlineMode:
          type: boolean
          description: Indicates whether inline HTML or a template label is used for consent.
          default: false
        created_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this authorization detail type was created.
        updated_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this authorization detail type was last updated.
    AuthDetailTypeWriteRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The authorization detail type URI.
        description:
          type: string
          description: Short description.
        schema:
          type: string
          description: Serialized JSON schema.
        useCustomMapping:
          type: boolean
        signatureStrategy:
          $ref: '#/components/schemas/AuthDetailTypeSignatureStrategy'
        signatureRule:
          type: string
        inlineMode:
          type: boolean
          default: false
    AuthDetailTypeListResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of items returned in this page.
        limit:
          type: integer
          description: Requested limit.
        page:
          type: integer
          description: Requested page number.
        total:
          type: integer
          description: Total number of matching items in the store.
        authDetailTypes:
          type: array
          items:
            $ref: '#/components/schemas/AuthDetailType'
    AuthDetailTypeSingleResponse:
      description: Single authorization detail type returned by a GET-by-id request.
      allOf:
        - $ref: '#/components/schemas/AuthDetailType'
    CustomTokenTypeType:
      type: string
      description: |
        Discriminator of the token type. Immutable after creation. Currently only JWT is supported.
      enum:
        - urn:ietf:params:oauth:token-type:jwt
    CustomTokenTypeValidate:
      type: object
      description: |
        How incoming tokens of this type are validated. Exactly one of jwksUri and jwks is required.
      properties:
        jwksUri:
          type: string
          description: Remote JWKS endpoint (https only), fetched at runtime. Alternative to jwks.
          example: https://idp.example.com/jwks
        jwks:
          type: object
          description: |
            Inline JWKS (public keys only), alternative to jwksUri. Keys carrying private parameters (d, p, q, dp, dq, qi) are rejected.
          additionalProperties: true
          example:
            keys:
              - kid: key-1
                kty: RSA
                'n': ...
                e: AQAB
        allowedKids:
          type: array
          description: Whitelist of key IDs. Empty means any key of the JWKS is accepted.
          items:
            type: string
        allowedSigningAlgs:
          type: array
          description: |
            Whitelist of JWA signing algorithms, at least one entry. Supported: RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384, ES512.
          items:
            type: string
        validateJti:
          type: boolean
          description: If true, the jti claim is checked for replay.
        timeSkew:
          type: integer
          minimum: 0
          description: Clock skew tolerance in seconds.
        toleranceWindow:
          type: integer
          minimum: 0
          description: Wider validity window for iat/exp in seconds. 0 or omitted means the default (1 hour).
    CustomTokenTypeIdentityMapping:
      type: object
      description: |
        Declarative lookup that links the token subject to a local identity. Active only if searchBy is set.
      properties:
        subjectId:
          type: string
          description: Token claim whose value is used for the lookup. Defaults to sub.
          example: sub
        searchBy:
          type: string
          description: Field of the local identity that is compared with the subject value.
          example: username
        entityType:
          type: string
          description: Entity type to search in.
          example: agent
        userRegistryConnection:
          type: string
          description: Server connection to validate user.
          example: verify_saas_user
    CustomTokenType:
      type: object
      required:
        - name
        - type
        - issuer
        - validate
      properties:
        id:
          type: string
          description: |
            Derived from the name: unpadded base64url encoding of name. Used as the path parameter of the item endpoints. Read-only, ignored in requests.
          readOnly: true
          example: dXJuOnRlc3Q6Y29t
        name:
          type: string
          description: |
            Value clients send as subject_token_type / actor_token_type. Unique, immutable after creation, and must not collide with a built-in token type.
          example: urn:test:com
        type:
          $ref: '#/components/schemas/CustomTokenTypeType'
        issuer:
          type: string
          description: Trusted issuer. Must match the iss claim of incoming tokens.
          example: https://www.ibm.com
        validate:
          $ref: '#/components/schemas/CustomTokenTypeValidate'
        identityMapping:
          $ref: '#/components/schemas/CustomTokenTypeIdentityMapping'
        identityMappingRule:
          type: string
          description: |
            Name of a mapping rule. Independent of identityMapping: fallback of the filter, or the only mechanism. Existence of the rule is not checked on write.
        created_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this custom token type was created.
        updated_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this custom token type was last updated.
    CustomTokenTypeWriteRequest:
      type: object
      description: |
        Create/replace payload. A SaaS token type payload is accepted as-is; SaaS-only fields (description, issue, identityMapping.jitp, identityMapping.realm, identityMapping.attributeMappings) are discarded.
      required:
        - name
        - type
        - issuer
        - validate
      properties:
        id:
          type: string
          description: Ignored. The id is generated by the server.
        name:
          type: string
        type:
          $ref: '#/components/schemas/CustomTokenTypeType'
        issuer:
          type: string
        validate:
          $ref: '#/components/schemas/CustomTokenTypeValidate'
        identityMapping:
          $ref: '#/components/schemas/CustomTokenTypeIdentityMapping'
        identityMappingRule:
          type: string
    CustomTokenTypeListResponse:
      type: object
      properties:
        customTokenTypes:
          type: array
          items:
            $ref: '#/components/schemas/CustomTokenType'
        total:
          type: integer
          description: Total number of custom token types across all pages.
        count:
          type: integer
          description: Number of custom token types returned on this page.
        limit:
          type: integer
          description: Maximum items per page that was requested.
        page:
          type: integer
          description: Current page number (1-based).
    CustomTokenTypeSingleResponse:
      description: Single custom token type returned by a GET-by-id request.
      allOf:
        - $ref: '#/components/schemas/CustomTokenType'
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: The OIDC error.
        error_description:
          type: string
          description: The OIDC error description.
    AuthorizationDetailsTypesFilter:
      required:
        - type
      type: object
      properties:
        type:
          type: string
          description: '''type'' attributes in the ''authorization_details'' object.'
        option:
          type: string
          description: Filter option for the authorization detail object. This determines the criteria by which the authorization_detail that is requested is allowed or not.
          enum:
            - none
            - advance
        rule:
          type: string
          description: Advance filtering using CELx script. Required when option is set to 'advance'.
    DynamicClientExtension:
      type: object
      description: Extension properties for non-standard client metadata.
      properties:
        jwt_bearer_assertion_token_type:
          type: string
          description: Token type for JWT bearer assertions.
        jwt_bearer_search_by:
          type: string
          description: Search criteria for JWT bearer flow.
        jwt_bearer_default_identity_source:
          type: string
          description: Default identity source for JWT bearer flow.
        restrict_authorization_details_types:
          type: boolean
          description: Flag to restrict authorization detail types.
        ignore_unknown_authorization_details_types:
          type: boolean
          description: Flag to ignore unknown authorization detail types.
        authorization_details_type_filters:
          type: array
          description: Filters for authorization detail types.
          items:
            $ref: '#/components/schemas/AuthorizationDetailsTypesFilter'
        subject_token_types:
          type: array
          description: Supported subject token types for token exchange.
          items:
            type: string
        actor_token_types:
          type: array
          description: Supported actor token types for token exchange.
          items:
            type: string
        requested_token_types:
          type: array
          description: Supported requested token types for token exchange.
          items:
            type: string
        actor_token_required:
          type: boolean
          description: Whether actor token is required for token exchange.
        token_exchange_client_groups:
          type: array
          description: Client groups for token exchange.
          items:
            type: string
        actor_criteria_rule:
          type: string
          description: Rule for actor criteria validation.
        skip_default_may_act_validation:
          type: boolean
          description: Skip default may_act validation.
        transaction_context_mapping:
          type: string
          description: Mapping rule for transaction context.
        apply_token_map_to_cc:
          type: boolean
          description: Apply token mapping to client credentials flow.
        entity_id:
          type: string
          description: ID of the entity that owns the client.
        entity_type:
          type: string
          description: Type of the entity that owns the client. The only allowed value is 'agent'.
        backchannel_user_auth_channels:
          type: array
          description: List of CIBA user authentication channels based on priority. Supported values are 'email' and 'push'.
          items:
            type: string
    ClientMetadata:
      required:
        - redirect_uris
      type: object
      properties:
        access_policy:
          type: string
          description: Access Policy ID.
        api_entitlements:
          type: array
          description: List of API entitlements.
          items:
            type: string
        authorization_encrypted_response_alg:
          type: string
          description: JWE 'alg' algorithm required for encrypting authorization responses.
        authorization_encrypted_response_enc:
          type: string
          description: JWE 'enc' algorithm required for encrypting authorization responses.
        authorization_signed_response_alg:
          type: string
          description: JWS 'alg' required for signing authorization responses.
        authorize_request_mapping:
          type: array
          description: Configuration to add request parameters for authorize endpoint
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the target parameter. 'context' sets the rule for authorization context. 'scope' sets the rule for the Consent request. 'intentId' sets the rule for the Open Banking intent ID.
                enum:
                  - context
                  - scope
                  - intentId
              custom:
                type: string
                description: The custom rule that defines the value of the target parameter to be set.
        authorize_response_mapping:
          type: array
          description: Configuration to add response parameters for authorize endpoint
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the target parameter.
              custom:
                type: string
                description: The custom rule that defines the value of the target parameter to be set.
              type:
                type: string
                description: The type of the target parameter. Allowed values are 'header' or 'parameter'.
                enum:
                  - header
                  - parameter
        authorization_details_types:
          type: array
          description: List of allowed authorization detail types.
          items:
            type: string
        backchannel_authentication_request_signing_alg:
          type: string
          description: JWS 'alg' algorithm that MUST be used for signing backchannel authentication request objects.
        backchannel_client_notification_endpoint:
          type: string
          description: Client notification endpoint URL for CIBA poll modes.
        backchannel_token_delivery_mode:
          type: string
          description: Token delivery mode for CIBA. Only allowed value is 'poll'.
        backchannel_user_code_parameter:
          type: boolean
          description: Boolean value specifying whether the RP supports the user_code parameter.
        client_name:
          type: string
          description: Client name.
        enforce_pkce:
          type: boolean
          description: Enforce the usage of PKCE.
        generateDeviceFlowQRCode:
          type: boolean
          description: Flag to indicate whether to generate QR code for device flow.
        grant_types:
          items:
            type: string
          type: array
          description: Array of grant types that the client may use. The allowed grant types are 'authorization_code', 'implicit', 'password', and 'refresh_token'.
        id_token_encrypted_response_alg:
          type: string
          description: JWE alg algorithm required for encrypting the ID Token assigned to this client.
        id_token_claims:
          type: array
          description: List of claims for id_token and user information.
          items:
            type: string
        id_token_encrypted_response_enc:
          type: string
          description: JWE enc algorithm required for encrypting the ID Token assigned to this client.
        id_token_signed_response_alg:
          type: string
          description: Token signing algorithm required for signing the ID token issued for this client.
        initiate_login_uri:
          type: string
          description: URI that uses the https scheme that a third party can use to initiate a login by the RP.
        jwks:
          type: object
          description: Client's JSON Web Key Set document representing the client's public keys.
        jwks_uri:
          type: string
          description: URL referencing the client's JSON Web Key Set document representing the client's public keys.
        extension:
          $ref: '#/components/schemas/DynamicClientExtension'
        redirect_uris:
          items:
            type: string
          type: array
          description: Array of redirection URIs for use in redirect-based flows.
        request_object_encryption_alg:
          type: string
          description: JWE 'alg' algorithm the RP is declaring that it can use for encrypting Request Objects sent to the OP.
        request_object_encryption_enc:
          type: string
          description: JWE 'enc' algorithm the RP is declaring that it can use for encrypting Request Objects sent to the OP.
        request_object_signing_alg:
          type: string
          description: JWS 'alg' algorithm that MUST be used for signing Request Objects sent to the OP.
        require_pushed_authorization_requests:
          type: boolean
          description: Flag to indicate whether pushed authorization request (PAR) is required.
        request_uris:
          type: array
          description: Array of request_uri values that are pre-registered by the RP for use at the OP.
          items:
            type: string
        response_types:
          items:
            type: string
          type: array
          description: Array of the OAuth 2.0 response types that the client may use.
        scope:
          description: A space-delimited string of allowed scopes.
          type: string
        software_id:
          type: string
          description: A unique identifier string that identifies the client software to be digitally registered.
        software_statement:
          type: string
          description: A signed JWT that asserts metadata values about the client software as a bundle.
        tls_client_auth_san_dns:
          type: string
          description: The expected DNS name SAN entry in the certificate that the client will use in mutual TLS authentication.
        tls_client_auth_subject_dn:
          type: string
          description: The expected subject distinguished name of the certificate that the client will use in mutual TLS authentication.
        tls_client_auth_san_email:
          type: string
          description: The expected email address SAN entry in the certificate that the client will use in mutual TLS authentication.
        tls_client_auth_san_ip:
          type: string
          description: The expected IP address SAN entry in the certificate that the client will use in mutual TLS authentication.
        tls_client_auth_san_uri:
          type: string
          description: The expected URI SAN entry in the certificate that the client will use in mutual TLS authentication.
        tls_client_certificate_bound_access_tokens:
          type: boolean
          description: Indicates if certificate binding for access token is required.
        token_endpoint_auth_method:
          type: string
          description: The client authentication method for the token endpoint.
          enum:
            - default
            - client_secret_basic
            - client_secret_post
            - private_key_jwt
            - tls_client_auth
        token_endpoint_auth_signing_alg:
          type: string
          description: JWS 'alg' algorithm that must be used for signing the JWT used to authenticate the client at the Token Endpoint for the 'private_key_jwt' authentication methods.
        token_claims:
          type: array
          description: List of claims for introspect and JWT access token.
          items:
            type: string
        token_endpoint_auth_single_use_jti:
          type: boolean
          description: Flag to indicate whether the JTI for token endpoint is single-use only.
        userinfo_encrypted_response_alg:
          type: string
          description: Userinfo response JWT encryption algorithm.
        userinfo_encrypted_response_enc:
          type: string
          description: Userinfo response JWT encryption content algorithm.
        userinfo_signed_response_alg:
          type: string
          description: Userinfo response JWT signing algorithm.
    DynamicClientRequest:
      type: object
      required:
        - redirect_uris
      properties:
        redirect_uris:
          type: array
          items:
            description: Redirection URI value used by the Client
            type: string
        response_types:
          type: array
          items:
            description: |
              OAuth 2.0 response_type values that the Client is declaring that it will 
              restrict itself to using
            type: string
            enum:
              - code
              - token
              - id_token
              - code token
              - code id_token
              - token id_token
              - code token id_token
              - none
        grant_types:
          type: array
          items:
            description: |
              OAuth 2.0 Grant Types that the Client is declaring that it will 
              restrict itself to using.
            type: string
            enum:
              - authorization_code
              - implicit
              - password
              - client_credentials
              - refresh_token
              - urn:openid:params:grant-type:ciba
        application_type:
          description: Kind of the application.
          type: string
          enum:
            - native
            - web
        contacts:
          type: array
          items:
            description: E-mail address of people responsible for this Client.
            type: string
        client_name:
          description: Name of the Client to be presented to the End-User.
          type: string
        logo_uri:
          description: URL that references a logo for the Client application.
          type: string
        client_uri:
          description: URL of the home page of the Client.
          type: string
        policy_uri:
          description: |
            URL that the Relying Party Client provides to the End-User to read
            about the how the profile data will be used.
          type: string
        tos_uri:
          description: |
            URL that the Relying Party Client provides to the End-User to read 
            about the Relying Party's terms of service.
          type: string
        jwks_uri:
          description: |
            URL for the Client's JSON Web Key Set document. 
          type: string
        jwks:
          description: |
            Client's JSON Web Key Set document, passed by value.
          type: object
        sector_identifier_uri:
          description: |
            URL using the https scheme to be used in calculating Pseudonymous 
            Identifiers by the OIDC Provider. It is not supported by this implementation
            since it only support public subject_type.
          type: string
        subject_type:
          description: |
            subject_type requested for responses to this Client.
          type: string
          enum:
            - public
        id_token_signed_response_alg:
          description: |
            JWS "alg" algorithm REQUIRED for signing the ID Token issued to this Client.
          type: string
          enum:
            - RS256
            - RS384
            - RS512
            - ES256
            - ES384
            - ES512
            - PS256
            - PS384
            - PS512
        id_token_encrypted_response_alg:
          description: |
            JWE "alg" algorithm REQUIRED for encrypting the ID Token issued to this Client.
          type: string
          enum:
            - none
            - RSA-OAEP
            - RSA-OAEP-256
        id_token_encrypted_response_enc:
          description: |
            JWE "enc" algorithm REQUIRED for encrypting the ID Token issued to this Client.
          type: string
          enum:
            - none
            - A128GCM
            - A192GCM
            - A256GCM
        userinfo_signed_response_alg:
          description: |
            JWS "alg" algorithm REQUIRED for signing UserInfo Responses
          type: string
          enum:
            - RS256
            - RS384
            - RS512
            - ES256
            - ES384
            - ES512
            - PS256
            - PS384
            - PS512
        userinfo_encrypted_response_alg:
          description: |
            JWE "alg" algorithm REQUIRED for encrypting UserInfo Responses
          type: string
          enum:
            - none
            - RSA-OAEP
            - RSA-OAEP-256
        userinfo_encrypted_response_enc:
          description: |
            JWE "enc" algorithm REQUIRED for encrypting UserInfo Responses
          type: string
          enum:
            - none
            - A128GCM
            - A192GCM
            - A256GCM
        request_object_signing_alg:
          description: |
            JWS "alg" algorithm that MUST be used for signing Request Objects 
            sent to the OIDC Provider
          type: string
          enum:
            - RS256
            - RS384
            - RS512
            - ES256
            - ES384
            - ES512
            - PS256
            - PS384
            - PS512
        request_object_encryption_alg:
          description: |
            JWE "alg" algorithm the Relying Party is declaring that it may use 
            for encrypting Request Objects sent to the OIDC Provider
          type: string
          enum:
            - none
            - RSA-OAEP
            - RSA-OAEP-256
        request_object_encryption_enc:
          description: |
            JWE "enc" algorithm the Relying Party is declaring that it may use 
            for encrypting Request Objects sent to the OIDC Provider
          type: string
          enum:
            - none
            - A128GCM
            - A192GCM
            - A256GCM
        token_endpoint_auth_method:
          description: |
            Requested Client Authentication method for the Token Endpoint
          type: string
          enum:
            - default
            - client_secret_basic
            - client_secret_post
            - private_key_jwt
            - tls_client_auth
        token_endpoint_auth_signing_alg:
          description: |
            JWS "alg" algorithm that MUST be used for signing the JWT used to 
            authenticate the Client at the Token Endpoint for the private_key_jwt
            authentication method.
          type: string
          enum:
            - RS256
            - RS384
            - RS512
            - ES256
            - ES384
            - ES512
            - PS256
            - PS384
            - PS512
        token_endpoint_auth_single_use_jti:
          description: |
            Whether private_key_jwt client assertion can only be used once. This is 
            done by checking the "jti" claim uniqueness.
          type: boolean
        default_max_age:
          description: |
            Default Maximum Authentication Age
            This implementation does not read this configuration.
          type: number
        default_acr_values:
          type: array
          items:
            description: |
              Default Authentication Context Class Reference value.
              This implementation does not read this configuration.
            type: string
        initiate_login_uri:
          description: |
            URI using the https scheme that a third party can use to initiate 
            a login by the Relying Party
          type: string
        request_uris:
          type: array
          items:
            description: |
              request_uri value that are pre-registered by the Relying Party for 
              use at the OIDC Provider
            type: string
        scope:
          description: |
            Space-delimited string containing list of scope values that the client
            can use when requesting access tokens.
          type: string
        tls_client_auth_subject_dn:
          description: |
            Expected subject distinguished name of the certificate that the
            client will use in mutual-TLS authentication.
          type: string
        tls_client_auth_san_dns:
          description: |
            Expected DNS Name SAN entry in the certificate that the client 
            will use in mutual-TLS authentication.
          type: string
        tls_client_auth_san_email:
          description: |
            Expected RFC822 Name SAN entry in the certificate that the client
            will use in mutual-TLS authentication.
          type: string
        tls_client_auth_san_ip:
          description: |
            Expected IP Address SAN entry in the certificate that the client
            will use in mutual-TLS authentication.
          type: string
        tls_client_auth_san_uri:
          description: |
            Expected Uniform Resource Identifier (URI) SAN entry in the 
            certificate that the client will use in mutual-TLS authentication
          type: string
        tls_client_certificate_bound_access_tokens:
          description: |
            Indicate the client's intention to use mutual-TLS client 
            certificate-bound access tokens.
          type: boolean
        require_pushed_authorization_requests:
          description: |
            Indicates whether the client is required to use Pushed Authorization
            Request to initiate authorization requests.
          type: boolean
        enforce_pkce:
          description: |
            Indicates whether the client is required to use Proof Key for Code Exchange
            (PKCE) in the authorization requests.
          type: boolean
        backchannel_token_delivery_mode:
          description: |
            Method of delivering the tokens after a successful user authentication.
          type: string
          enum:
            - poll
            - ping
        backchannel_client_notification_endpoint:
          description: |
            The endpoint to which the OIDC Provider will post a notification 
            after a successful or failed end-user authentication. Required if the 
            token delivery mode is set to "ping".
          type: string
        backchannel_user_code_parameter:
          description: |
            Indicates whether the client is sending user_code parameter
          type: boolean
        software_id:
          description: |
            A unique identifier string assigned by the client developer or software 
            publisher used by registration endpoints to identify the client software to
            be dynamically registered. The value of this field is not intended to be 
            human readable and is usually opaque to the client and authorization server.
          type: string
        software_version:
          description: |
            A version identifier string for the client software identified by
            "software_id".  The value of the "software_version" SHOULD change
            on any update to the client software identified by the same "software_id".
          type: string
        software_statement:
          description: |
            A software statement is a JSON Web Token (JWT) that asserts metadata values about
            the client software as a bundle. All the properties above can be specified in 
            a software statement. When presented to the authorization server as part of a
            client registration request, the software statement MUST be digitally signed
            and MUST contain an "iss" (issuer) claim denoting the party attesting to the
            claims in the software statement. Client metadata values conveyed in the 
            software statement will take precedence over those conveyed using plain JSON elements.
            When using Dynamic Client Registration for FAPI specification, the software statement 
            is generated by regulatory body and there are certain rules to follow. 
          type: string
