# oapi-codegen configuration for the OAuth Clients management API.
# Paths are relative to the api/ directory, where `go generate` runs (see generate.go).
package: clients
output: ../internal/resource/clients/api.gen.go
generate:
  models: true
  client: true
output-options:
  # Adds a yaml tag identical to the json tag (name and omitempty) on every
  # property, as required by internal/resource/spec.md section 2.
  yaml-tags: true
  # The OpenAPI schema "Client" would otherwise collide with the generated
  # HTTP client type of the same name.
  client-type-name: APIClient
  # The bundled spec covers several resources; generate only the clients
  # operations (unreferenced schemas are pruned).
  include-tags:
    - Clients
