# oapi-codegen configuration for the Agent Registry API.
# Paths are relative to the api/ directory, where `go generate` runs (see ../generate.go).
package: agents
output: ../internal/resource/agents/api.gen.go
generate:
  models: true
  client: true
output-options:
  # Adds a yaml tag identical to the json tag (name and omitempty) on every
  # property, as required by internal/resource/spec.md section 2.
  yaml-tags: true
