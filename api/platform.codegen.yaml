# oapi-codegen configuration for the Platform API (Server Connections, consolidated openapi.yaml).
# Paths are relative to the api/ directory, where `go generate` runs (see generate.go).
package: platform
output: ../internal/client/platform/openapi.gen.go
generate:
  models: true
  client: true
output-options:
  # Adds a yaml tag identical to the json tag (name and omitempty) on every property.
  yaml-tags: true
  # The consolidated spec covers several APIs; generate only the Platform operations.
  include-tags:
    - Platform
