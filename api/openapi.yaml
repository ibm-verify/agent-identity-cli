    post:
      summary: Create a custom token type.
      operationId: createCustomTokenType
      description: 'Registers a trusted external token issuer. The id is generated
        by the server. The name must be unique and must not collide with a built-in
        token type. SaaS-only fields (description, issue, identityMapping.jitp, identityMapping.realm,
        identityMapping.attributeMappings) are accepted and silently discarded.

        '
      tags:
