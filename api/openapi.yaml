            \ metadata values about\nthe client software as a bundle. All the properties\
            \ above can be specified in \na software statement. When presented to\
            \ the authorization server as part of a\nclient registration request,\
            \ the software statement MUST be digitally signed\nand MUST contain an\
            \ \"iss\" (issuer) claim denoting the party attesting to the\nclaims in\
            \ the software statement. Client metadata values conveyed in the \nsoftware\
            \ statement will take precedence over those conveyed using plain JSON\
            \ elements.\nWhen using Dynamic Client Registration for FAPI specification,\
            \ the software statement \nis generated by regulatory body and there are\
            \ certain rules to follow. \n"
          type: string
    ServerConnectionType:
      type: string
      description: Server connection type.
      enum:
      - http
      - ldap
    AuthenticationType:
      type: string
      description: Authentication type used by the outbound HTTP connection.
      enum:
      - none
      - basic
      - api_key
      - oauth
      - mtls
    ServerConnectionAuthentication:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/AuthenticationType'
        client_id:
          type: string
          description: OAuth client ID. Resolved through the secret resolver when
            one is configured.
        client_secret:
          type: string
          description: OAuth client secret. Resolved through the secret resolver when
            one is configured.
        token_url:
          type: string
          format: uri
          description: OAuth token endpoint.
        token_tls:
          $ref: '#/components/schemas/ServerConnectionTLS'
        token_params:
          type: object
          description: Extra form parameters sent on the token request. Must not contain
            grant_type, client_id or client_secret. Only for type=oauth.
          additionalProperties:
            type: string
        token_headers:
          type: object
          description: Extra headers sent on the token request. Must not contain Authorization,
            Content-Type, Content-Length or Host. Only for type=oauth.
          additionalProperties:
            type: string
        username:
          type: string
          description: Basic-auth username (literal).
        password:
          type: string
          description: Basic-auth password (literal).
        api_key_ref:
          type: string
          description: Reference to the API key.
        api_key_header:
          type: string
          description: HTTP header used to send the API key.
    ServerConnectionTLS:
      type: object
      properties:
        verify_server_certificate:
          type: boolean
          default: true
        ca_cert_ref:
          type: string
          description: Optional keystore reference for a custom CA certificate.
        client_cert_ref:
          type: string
          description: Optional keystore reference for an mTLS client certificate.
        client_key_ref:
          type: string
          description: Optional keystore reference for an mTLS client key.
    ServerConnectionRetry:
      type: object
      properties:
        max_attempts:
          type: integer
          minimum: 1
          default: 1
        backoff:
          type: string
          enum:
          - none
          - fixed
          - exponential
          default: none
    HTTPOperation:
      type: object
      description: Named, reusable operation. The path and query values may contain
        {variable} placeholders.
      required:
      - method
      - path
      properties:
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        path:
          type: string
          example: /v2/users/{user_id}
        query:
          type: object
          description: Static query parameters; values may contain {variable} placeholders.
          additionalProperties:
            type: string
        headers:
          type: object
          description: Static request headers sent on every call to this operation.
            Values are stored and returned literally; do not put secrets here. Authentication
            headers override these.
          additionalProperties:
            type: string
          example:
            Content-Type: application/json
            Accept: application/json
        outbound_rule:
          type: string
          maxLength: 65536
          description: JavaScript run before the request is sent. Requires a transform
            runner.
        inbound_rule:
          type: string
          maxLength: 65536
          description: JavaScript run on the response. Requires a transform runner.
    ConnectionTransform:
      type: object
      description: Optional inline JavaScript run around every outbound call on the
        connection. Requires a transform runner.
      properties:
        pre:
          type: string
          maxLength: 65536
          description: Runs before the request is sent.
        post:
          type: string
          maxLength: 65536
          description: Runs after the response is received.
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 10000
          description: Per script run timeout in milliseconds. Defaults to 2000.
    HTTPSearchQuery:
      type: object
      description: SCIM query parameters of a named search.
      properties:
        filter:
          type: string
          description: SCIM filter. {variable} placeholders are substituted as SCIM
            string literals.
          example: userName eq "{value}" and active eq true
        count:
          type: integer
          minimum: 1
          description: Sent as the SCIM count parameter and applied as a client-side
            cap.
        attributes:
          type: string
          description: Comma-separated SCIM attribute names to pull.
          example: id,name,displayName,emails
    HTTPSearch:
      type: object
      description: Named, reusable SCIM search. HTTP connections assume the SCIM 2.0
        schema. The path may contain {variable} placeholders substituted from SearchVars.
      required:
      - method
      - path
      properties:
        method:
          type: string
          enum:
          - GET
        path:
          type: string
          example: /Users/{value}
        query:
          $ref: '#/components/schemas/HTTPSearchQuery'
        attribute_map:
          type: object
          description: Maps a SCIM attribute (dotted paths allowed) to the target
            name in the result.
          additionalProperties:
            type: string
        outbound_rule:
          type: string
          maxLength: 65536
          description: JavaScript run before the request is sent. Requires a transform
            runner.
        inbound_rule:
          type: string
          maxLength: 65536
          description: JavaScript run on the response. Requires a transform runner.
        validation_rule:
          type: string
          maxLength: 65536
          description: JavaScript run once per returned resource. The script sets
            the global valid to true to keep the resource and false to drop it. Requires
            a transform runner.
          example: valid = resource.active === true;
    HTTPConnectionConfig:
      type: object
      description: Configuration for type=http connections.
      required:
      - base_url
      properties:
        base_url:
          type: string
          format: uri
          description: Base URL of the remote service.
        timeout_seconds:
          type: integer
          minimum: 1
          description: Maximum time to wait for one outbound HTTP request.
        authentication:
          $ref: '#/components/schemas/ServerConnectionAuthentication'
        tls:
          $ref: '#/components/schemas/ServerConnectionTLS'
        retry:
          $ref: '#/components/schemas/ServerConnectionRetry'
        operations:
          type: object
          description: Named operations, keyed by operation name.
          additionalProperties:
            $ref: '#/components/schemas/HTTPOperation'
        searches:
          type: object
          description: Named SCIM searches, keyed by search name.
          additionalProperties:
            $ref: '#/components/schemas/HTTPSearch'
        transform:
          $ref: '#/components/schemas/ConnectionTransform'
    LDAPSearchTemplate:
      type: object
      description: Named, reusable LDAP search. The filter may contain {variable}
        placeholders.
      required:
      - base_dn
      - scope
      - filter
      properties:
        base_dn:
          type: string
        scope:
          type: string
          enum:
          - base
          - one
          - subtree
        object_class:
          type: string
          description: Merged into the filter as (&(objectClass=X)(filter)).
        filter:
          type: string
          example: (uid={user_id})
        attributes:
          type: array
          items:
            type: string
        size_limit:
          type: integer
          minimum: 0
        time_limit:
          type: integer
          minimum: 0
    LDAPConnectionConfig:
      type: object
      description: Configuration for type=ldap connections.
      required:
      - host
      - port
      properties:
        host:
          type: string
          minLength: 1
        port:
          type: integer
          minimum: 1
          maximum: 65535
        use_ssl:
          type: boolean
          default: false
        bind_dn_ref:
          type: string
          description: Reference to the service-account bind DN secret.
        bind_password_ref:
          type: string
          description: Reference to the service-account bind password secret.
        timeout_seconds:
          type: integer
          minimum: 1
        tls:
          $ref: '#/components/schemas/ServerConnectionTLS'
        searches:
          type: object
          description: Named search templates, keyed by search name.
          additionalProperties:
            $ref: '#/components/schemas/LDAPSearchTemplate'
        transform:
          $ref: '#/components/schemas/ConnectionTransform'
        pool_max_size:
          type: integer
          minimum: 1
          description: Maximum idle pooled connections. Defaults to 5.
        pool_max_idle_time:
          type: string
          description: Go duration string, for example "2m30s". Defaults to 5m.
    ServerConnectionWriteRequest:
      type: object
      description: 'Request body for POST and PUT. Exactly one of http or ldap must
        be supplied and it must match type.

        '
      required:
      - name
      - type
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]{0,126}[A-Za-z0-9])?$
          description: 'Server connection name: the identifier, unique per tenant
            and immutable. Optional on PUT; when present it must equal the path name.'
        type:
          $ref: '#/components/schemas/ServerConnectionType'
        http:
          $ref: '#/components/schemas/HTTPConnectionConfig'
        ldap:
          $ref: '#/components/schemas/LDAPConnectionConfig'
    ServerConnection:
      type: object
      description: Full server connection definition.
      allOf:
      - $ref: '#/components/schemas/ServerConnectionWriteRequest'
      - type: object
        required:
        - created_at
        - updated_at
        properties:
          created_at:
            type: string
            format: date-time
            readOnly: true
            description: Time when the server connection was created.
          updated_at:
            type: string
            format: date-time
            readOnly: true
            description: Time when the server connection was last updated.
    ServerConnectionSummary:
      type: object
      required:
      - name
      - type
      - created_at
      - updated_at
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ServerConnectionType'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ServerConnectionListResponse:
      type: object
      properties:
        server_connections:
          type: array
          description: List of server connection summaries for the current page.
          items:
            $ref: '#/components/schemas/ServerConnectionSummary'
        total:
          type: integer
        count:
          type: integer
        limit:
          type: integer
        page:
          type: integer
