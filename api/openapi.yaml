        identityMapping.attributeMappings) are discarded.

        '
      required:
      - name
      - type
      - issuer
      - validate
      properties:
        id:
          type: string
          description: Ignored. The id is generated by the server.
        name:
          type: string
        type:
          $ref: '#/components/schemas/CustomTokenTypeType'
        issuer:
          type: string
        validate:
          $ref: '#/components/schemas/CustomTokenTypeValidate'
        identityMapping:
          $ref: '#/components/schemas/CustomTokenTypeIdentityMapping'
        identityMappingRule:
          type: string
    CustomTokenTypeListResponse:
      type: object
      properties:
        customTokenTypes:
          type: array
