          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Custom token type not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
