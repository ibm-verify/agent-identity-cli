            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a rule.
      operationId: createRule
      description: 'Creates a new rule from its name, class and source. The rule type,
        the imported scripts/bindings and the compiled bytecode are derived by the
        server.

        '
      tags:
      - Platform
      requestBody:
        required: true
