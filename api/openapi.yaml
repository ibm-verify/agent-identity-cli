          type: string
          description: Short description.
        schema:
          type: string
          description: Serialized JSON schema.
        useCustomMapping:
          type: boolean
        signatureStrategy:
          $ref: '#/components/schemas/AuthDetailTypeSignatureStrategy'
        signatureRule:
          type: string
        inlineMode:
          type: boolean
          default: false
    AuthDetailTypeListResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of items returned in this page.
        limit:
          type: integer
          description: Requested limit.
        page:
          type: integer
          description: Requested page number.
        total:
          type: integer
          description: Total number of matching items in the store.
        authDetailTypes:
          type: array
          items:
            $ref: '#/components/schemas/AuthDetailType'
    AuthDetailTypeSingleResponse:
      description: Single authorization detail type returned by a GET-by-id request.
      allOf:
      - $ref: '#/components/schemas/AuthDetailType'
    CustomTokenTypeType:
      type: string
      description: 'Discriminator of the token type. Immutable after creation. Currently
        only JWT is supported.

        '
      enum:
      - urn:ietf:params:oauth:token-type:jwt
    CustomTokenTypeValidate:
      type: object
      description: 'How incoming tokens of this type are validated. Exactly one of
        jwksUri and jwks is required.

        '
      properties:
        jwksUri:
          type: string
          description: Remote JWKS endpoint (https only), fetched at runtime. Alternative
            to jwks.
          example: https://idp.example.com/jwks
        jwks:
          type: object
          description: 'Inline JWKS (public keys only), alternative to jwksUri. Keys
            carrying private parameters (d, p, q, dp, dq, qi) are rejected.

            '
          additionalProperties: true
          example:
            keys:
            - kid: key-1
              kty: RSA
              n: '...'
              e: AQAB
        allowedKids:
          type: array
          description: Whitelist of key IDs. Empty means any key of the JWKS is accepted.
          items:
            type: string
        allowedSigningAlgs:
          type: array
          description: 'Whitelist of JWA signing algorithms, at least one entry. Supported:
            RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384, ES512.

            '
          items:
            type: string
        validateJti:
          type: boolean
          description: If true, the jti claim is checked for replay.
        timeSkew:
          type: integer
          minimum: 0
          description: Clock skew tolerance in seconds.
        toleranceWindow:
          type: integer
          minimum: 0
          description: Wider validity window for iat/exp in seconds. 0 or omitted
            means the default (1 hour).
    CustomTokenTypeIdentityMapping:
      type: object
      description: 'Declarative lookup that links the token subject to a local identity.
        Active only if searchBy is set.

        '
      properties:
        subjectId:
          type: string
          description: Token claim whose value is used for the lookup. Defaults to
            sub.
          example: sub
        searchBy:
          type: string
          description: Field of the local identity that is compared with the subject
            value.
          example: username
        entityType:
          type: string
          description: Entity type to search in.
          example: agent
        userRegistryConnection:
          type: string
          description: Server connection to validate user.
          example: verify_saas_user
    CustomTokenType:
      type: object
      required:
      - name
      - type
      - issuer
      - validate
      properties:
        id:
          type: string
          description: 'Derived from the name: unpadded base64url encoding of name.
            Used as the path parameter of the item endpoints. Read-only, ignored in
            requests.

            '
          readOnly: true
          example: dXJuOnRlc3Q6Y29t
        name:
          type: string
          description: 'Value clients send as subject_token_type / actor_token_type.
            Unique, immutable after creation, and must not collide with a built-in
            token type.

            '
          example: urn:test:com
        type:
          $ref: '#/components/schemas/CustomTokenTypeType'
        issuer:
          type: string
          description: Trusted issuer. Must match the iss claim of incoming tokens.
          example: https://www.ibm.com
        validate:
          $ref: '#/components/schemas/CustomTokenTypeValidate'
        identityMapping:
          $ref: '#/components/schemas/CustomTokenTypeIdentityMapping'
        identityMappingRule:
          type: string
          description: 'Name of a mapping rule. Independent of identityMapping: fallback
            of the filter, or the only mechanism. Existence of the rule is not checked
            on write.

            '
        created_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this custom token type was
            created.
        updated_at:
          type: integer
          format: int64
          readOnly: true
          description: Unix timestamp (milliseconds) when this custom token type was
            last updated.
    CustomTokenTypeWriteRequest:
      type: object
      description: 'Create/replace payload. A SaaS token type payload is accepted
