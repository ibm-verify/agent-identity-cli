# oapi-codegen configuration for the Registry API (consolidated openapi.yaml).
# Paths are relative to the api/ directory, where `go generate` runs (see generate.go).
package: registry
output: ../internal/client/registry/openapi.gen.go
generate:
  models: true
  client: true
output-options:
  # Adds a yaml tag identical to the json tag (name and omitempty) on every property.
  yaml-tags: true
  # The consolidated spec covers several APIs; generate only the Registry operations.
  include-tags:
    - Registry
